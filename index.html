<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Constelación</title><style>body{margin:0;background:#f6f1e8;color:#3d342c;font:18px Georgia,serif}main{max-width:560px;margin:8vh auto;padding:24px;text-align:center}h1{font-size:clamp(38px,8vw,64px);font-weight:normal}button,input{font:16px system-ui;padding:13px;border-radius:8px}button{background:#80563e;color:white;border:0;cursor:pointer}input{max-width:90%}.muted{color:#776a5f;font-size:15px}#preview{max-width:100%;max-height:45vh;margin:20px auto;display:none}#printArea{display:none}@media print{@page{size:4in 6in;margin:0}body{background:white}main{display:none}#printArea{display:flex;width:4in;height:6in;align-items:center;justify-content:center;overflow:hidden}#printArea img{width:100%;height:100%;object-fit:contain}} </style></head><body><main><h1>Constelación</h1><p>A growing collection of photographs, memories, and connections.</p><p>Choose a photograph of a person, place, object, or moment that reminds you of home.</p><input id="file" type="file" accept="image/*"><img id="preview" alt="Selected photograph"><p class="muted">Only share photographs you have permission to display publicly. Your image stays on this device in this demo.</p><button id="print" disabled>Print photograph</button><p class="muted" id="status">Select a photo to begin.</p></main><div id="printArea"><img id="printImage" alt="Photograph for printing"></div><script>const file=document.querySelector('#file'),preview=document.querySelector('#preview'),printImage=document.querySelector('#printImage'),button=document.querySelector('#print'),status=document.querySelector('#status');let url;file.addEventListener('change',()=>{if(url)URL.revokeObjectURL(url);const f=file.files[0];if(!f)return;if(!f.type.startsWith('image/')){status.textContent='Please select an image.';return}url=URL.createObjectURL(f);preview.src=url;printImage.src=url;preview.style.display='block';button.disabled=false;status.textContent='Ready to print.'});button.addEventListener('click',()=>{status.textContent='Confirm the printer and paper size in the iPad print dialog.';window.print()});</script></body></html>
